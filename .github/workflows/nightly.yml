name: Nightly

# Reruns the install through Biorouter against the newest Biorouter release, and rechecks the
# three soft contracts this extension keeps with Biorouter's core, so a core change that breaks
# the fallback shows up within a day:
#   - the desktop lock Biorouter Copilot takes (`<local data>/BioRouter/computer-use.desktop.lock`),
#   - the elicitation answer route (`/action-required/elicitation`, user action proof required),
#   - the install command shape (`uv run --directory <dir> <entry_point>`).

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Newest Biorouter release
        id: latest
        run: echo "tag=$(gh release view --repo BaranziniLab/biorouter --json tagName --jq .tagName)" >> "$GITHUB_OUTPUT"
      - name: Core still names the same lock, route and launch
        run: |
          fetch() { gh api "repos/BaranziniLab/biorouter/contents/$1?ref=${{ steps.latest.outputs.tag }}" --jq .content | base64 -d; }
          fetch crates/biorouter/src/security/computer_use.rs > lock.rs
          grep -q '"BioRouter"' lock.rs && grep -q '"computer-use.desktop.lock"' lock.rs && grep -q 'data_local_dir' lock.rs
          fetch crates/biorouter-server/src/routes/action_required.rs > route.rs
          grep -q '/action-required/elicitation' route.rs
          fetch crates/biorouter/src/extension_install/transaction.rs > install.rs
          grep -q '"--directory"' install.rs && grep -q 'manifest.entry_point.clone()' install.rs

  biorouter-install:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      OCUA_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.8"
          cache: false
      - uses: astral-sh/setup-uv@v6
      - name: Build the Linux helper and a Linux only bundle
        run: |
          python3 scripts/build_helper.py build linux-x64
          python3 scripts/build_brxt.py build --payloads build/payload
      - name: Install the newest Biorouter CLI
        run: |
          tag=$(gh release view --repo BaranziniLab/biorouter --json tagName --jq .tagName)
          gh release download "$tag" --repo BaranziniLab/biorouter --pattern "biorouter-cli_*_amd64.deb" --dir /tmp/biorouter
          sudo apt-get update
          sudo apt-get install -y /tmp/biorouter/*.deb python3-gi gir1.2-atspi-2.0 gir1.2-gtk-3.0 at-spi2-core xvfb xauth dbus-x11 openbox
      - name: Install and drive the bundle through Biorouter (L6)
        run: |
          cat > /tmp/l6.sh <<'SH'
          set -e
          export XDG_RUNTIME_DIR=$(mktemp -d) XDG_SESSION_TYPE=x11
          chmod 700 "$XDG_RUNTIME_DIR"
          openbox --sm-disable &
          mkdir -p /tmp/fixture && /usr/bin/python3 fixtures/fixture_gtk.py /tmp/fixture &
          for i in $(seq 1 100); do [ -f /tmp/fixture/ready ] && break; sleep 0.2; done
          python3 tests/test_biorouter_install.py --bin /usr/bin --root "$(mktemp -d)" --answer allow --app desktop-fixture
          SH
          xvfb-run -a dbus-run-session -- bash /tmp/l6.sh
